[project]
name = "swarmr-kube"
version = "1.1.0"
description = "Kubernetes incident investigation team for swarmr."
requires-python = ">=3.13"
# The team owns its SDK. `swarmr` is capped to a minor because `Team`,
# `RunContext`, `TeamBuild` and the `swarmr.teams` entry-point group are an ABI
# this package implements; a minor bump may move them.
dependencies = [
  "swarmr>=1.0,<2",
  "kubernetes>=32",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pyright>=1.1"]

# The one line that makes this package a team. `swarmr` reads this group from
# installed distribution metadata and imports nothing until the team is run.
[project.entry-points."swarmr.teams"]
k8s_incident = "swarmr_kube:TEAM"

[project.scripts]
incident-credentials = "swarmr_kube.credentials_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarmr_kube"]
# Tests live beside the code they test; they are not part of the installed
# package. The demo manifests are, so `teams` users can reproduce a scenario.
exclude = ["**/tests"]

[tool.pyright]
# venvPath/venv is the only project-level signal an editor's pyright reads, and
# without it the language server type-checks against whatever interpreter is on
# PATH — a bare system python where every third-party import is unresolved. CI
# therefore builds `.venv` too, so this one path is correct everywhere.
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
include = ["src"]
exclude = [".venv", "**/__pycache__"]
typeCheckingMode = "standard"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
testpaths = ["src"]
addopts = "-q --strict-markers --import-mode=importlib"
markers = ["e2e: needs a live cluster and a model API key"]

[tool.ruff]
line-length = 90
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
