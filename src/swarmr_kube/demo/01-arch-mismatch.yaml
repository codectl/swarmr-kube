# Fault 1 — image architecture mismatch (the headline demo).
#
# amd64/nginx is the Docker official per-architecture repository: its manifest
# publishes linux/amd64 and nothing else. Pinning the deployment to the arm64
# workers means every replica lands on a node the image cannot run on, so the
# EndpointSlice never gets a serving address and Traefik answers 503.
#
# Why it needs more than one investigator:
#   workload  sees StartError / "exec format error", knows only that it dies
#   network   sees an EndpointSlice with no ready address, no routing defect
#   platform  is the only one that can compare the image's real manifest
#             platforms against the node's kubernetes.io/arch
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: web
          image: amd64/nginx:1.29-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: demo
spec:
  selector:
    app: checkout
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: checkout
  namespace: demo
spec:
  rules:
    - host: checkout.demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: checkout
                port:
                  number: 80
