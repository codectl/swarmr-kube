# Fault 2 — Service targetPort drift (the deterministic 502).
#
# The image is multi-arch and the pod is genuinely Ready: nginx listens on 80
# and the readiness probe checks 80. Only the Service disagrees, pointing
# targetPort at 8081 where nothing listens. Traefik therefore has a serving
# endpoint, dials it, and the connection is refused -> HTTP 502.
#
# This is the one fault where the workload investigator must come back CLEAN:
# nothing is wrong with the container. Reporting "the app is broken" here is a
# failure of the agent, not of the cluster.
#
# Note deliberately NOT used here: a broken readinessProbe. That empties the
# EndpointSlice and yields 503, which is fault 1's mechanism, not a 502.
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      containers:
        - name: web
          image: nginx:1.29-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: demo
spec:
  selector:
    app: payments
  ports:
    - name: http
      port: 80
      targetPort: 8081 # nothing listens here; nginx is on 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payments
  namespace: demo
spec:
  rules:
    - host: payments.demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: payments
                port:
                  number: 80
